name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Generate synthetic data
        run: python scripts/generate_synthetic_data.py --out data/synthetic --seed 42
      - name: Eval with regression gates
        # Runs the offline (mock) pipeline. No API key required — the gates
        # verify the harness and guardrails on every push.
        run: python -m eval.run_eval --data data/synthetic --gate
